name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite with 100% coverage gate
        env:
          SECRET_KEY: ci-test-secret-key-which-is-long-enough-1234567890
        run: pytest --cov --cov-report=term-missing --cov-fail-under=100

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling
        run: pip install -r requirements.txt ruff black isort mypy bandit pip-audit
      - name: Ruff
        run: ruff check .
      - name: Black (check)
        run: black --check .
      - name: isort (check)
        run: isort --check-only .
      - name: mypy (non-blocking type check)
        run: mypy --ignore-missing-imports --no-strict-optional config models services utils api || true
      - name: Bandit security scan
        run: bandit -q -r config models services utils api -x tests || true
      - name: pip-audit (dependency vulnerabilities)
        run: pip-audit || true
