[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
    # PyJWT emits this for short dev secret keys; prod uses a long SECRET_KEY.
    "ignore:.*HMAC key.*:UserWarning",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "setup.py", "main.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.isort]
profile = "black"
line_length = 100
